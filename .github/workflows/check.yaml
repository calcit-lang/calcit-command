on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          deps-file: deps.cirru
          caps-version: "0.1.1"

      - name: Validate Calcit snapshot and types
        run: |
          caps --strict --ci
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code --quiet -- calcit.cirru
          calcit calcit.cirru --check-only --all-defs
          calcit calcit.cirru docs format-md README.md --check
          if calcit calcit.cirru eval --dep ./ -- 'ns app.main $ :require $ command.core :refer $ run-command

          run-command |printf 42' > "$RUNNER_TEMP/command-rest.log" 2>&1; then
            echo '::error::run-command accepted a numeric rest argument'
            exit 1
          fi
          grep -F '[E_FN_ARG_TYPE_MISMATCH] [Error] Function `command.core/run-command` arg 2' "$RUNNER_TEMP/command-rest.log"

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: stable
          components: clippy,rustfmt
          cache: false

      - run: cargo fmt --all -- --check

      - run: sh build.sh

      - run: cargo test --locked

      - run: cargo clippy --all-targets --locked -- -D warnings

      - run: bash scripts/check-c-safe-ffi.sh

      - name: Validate executable documentation
        run: |
          calcit calcit.cirru docs check-md README.md --failures-only
          calcit calcit.cirru docs check-md docs/process-execution.md --failures-only

      - run: calcit calcit.cirru
