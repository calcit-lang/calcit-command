on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"

      - name: Validate Calcit snapshot and types
        run: |
          caps --strict --ci
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --strict-types --check-only
          calcit calcit.cirru analyze check-public --ns command.core --ns command.test --ns command.util --summary-only --format json
          calcit calcit.cirru analyze quality
          calcit calcit.cirru docs format-md README.md --check

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - run: cargo fmt --all -- --check

      - run: cargo build --release

      - run: cargo test --locked

      - run: cargo clippy --all-targets -- -D warnings

      - run: mkdir -p dylibs/ && cp -v target/release/libcalcit_command.* dylibs/

      - run: bash scripts/check-c-safe-ffi.sh

      - name: Validate executable documentation
        run: |
          calcit calcit.cirru docs check-md README.md --failures-only
          calcit calcit.cirru docs check-md docs/process-execution.md --failures-only

      - run: calcit calcit.cirru
